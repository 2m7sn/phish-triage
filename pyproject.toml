[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phish-triage"
version = "0.1.0"
description = "L1 SOC triage for reported .eml files: verdict, score with reasons, IOCs, action"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdulmohsen Alharbi" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phish-triage = "phish_triage.cli:main"

[tool.setuptools]
packages = ["phish_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
