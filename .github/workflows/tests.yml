name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: python -m phish_triage eval corpus --out out
      - run: python -m phish_triage eval corpus-fresh --out out-fresh
      - run: python -m phish_triage eval corpus-heldout-r2 --out out-r2
